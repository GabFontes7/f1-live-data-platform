[project]
name = "f1-live-data-platform"
version = "0.1.0"
description = "Records the Formula 1 live timing stream into a replayable raw log, then models it into a tested warehouse."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastf1>=3.9,<4",
    "pandas>=2.1",
    "pyarrow>=16",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
f1-record = "f1platform.record:main"
f1-ingest = "f1platform.ingest:main"
f1-schema = "f1platform.schema:main"
f1-build = "f1platform.warehouse:main"
f1-fixture = "f1platform.fixtures:main"
f1-report = "f1platform.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1platform"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
